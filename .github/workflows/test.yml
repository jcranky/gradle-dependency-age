name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      - name: check dependency lockfiles are up to date
        # regenerating the locks must be a no-op: any diff means a declared
        # or transitive dependency changed without regenerating lockfiles
        run: |
          ./gradlew :dependencies --write-locks > /dev/null
          git diff --exit-code -- gradle.lockfile buildscript-gradle.lockfile
